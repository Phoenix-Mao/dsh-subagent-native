name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 必过：发布依据。Node 24 是作者本机验证过的运行时
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 单测
        run: npm test
      - name: 语法检查
        run: npm run lint
      - name: 打包内容校验
        run: npm pack --dry-run

  # 信息性：engines.node 声明了 >=22，但 22 上仍有 6 个「提前退出/取消」用例
  # 触发 node:test 的 pending-promise 判定，尚未定位。先跑不阻塞，见 PUBLISH-PLAN P3。
  node22:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 单测
        run: npm test

  # 信息性：目前只在 Windows 验证过，跨平台转正见 PUBLISH-PLAN P3
  linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 单测
        run: npm test
      - name: 语法检查
        run: npm run lint
