name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 主目标平台 + 本机验证的运行时
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 单测
        run: npm test
      - name: 语法检查
        run: npm run lint
      - name: 打包内容校验
        run: npm pack --dry-run

  # engines.node 声明了 >=22，必须在 22 上也是绿的
  node22:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 单测
        run: npm test

  # 跨平台：纯逻辑与参数构造在 Linux 上跑全量用例（真实 CLI 进程终止仍以 Windows 观察为准）
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 单测
        run: npm test
      - name: 语法检查
        run: npm run lint
